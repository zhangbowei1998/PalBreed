[project]
name = "pl-agent-agent"
version = "0.1.0"
description = "幻兽帕鲁配种 Agent — 独立 agent 模块（无 web 框架依赖）"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pl_agent"]

[tool.pytest.ini_options]
pythonpath = ["pl_agent"]
asyncio_mode = "auto"
