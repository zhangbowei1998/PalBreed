[project]
name = "pl-agent-api"
version = "0.1.0"
description = "幻兽帕鲁配种 Agent — FastAPI 服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pl-agent-core",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "sqlglot>=25.0",
]

[tool.uv.sources]
pl-agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pl_agent"]

[tool.pytest.ini_options]
testpaths = ["pl_agent/api/__tests__"]
