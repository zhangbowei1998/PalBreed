[project]
name = "pl-agent-agent-web"
version = "0.1.0"
description = "幻兽帕鲁配种 Agent — FastAPI 服务层（服务前端）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pl-agent-agent",
]

[tool.uv.sources]
pl-agent-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pl_agent"]

[tool.pytest.ini_options]
pythonpath = ["pl_agent"]
asyncio_mode = "auto"
