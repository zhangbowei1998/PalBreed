[project]
name = "pl-agent-adapters"
version = "0.1.0"
description = "幻兽帕鲁配种 Agent — 外部数据适配层"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "pl-agent-core"]

[tool.uv.sources]
pl-agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters"]

[tool.pytest.ini_options]
testpaths = ["adapters/paldb/__tests__"]
