[project]
name = "pl-agent"
version = "0.1.0"
description = "幻兽帕鲁配种 Agent — monorepo workspace"
requires-python = ">=3.10"
dependencies = ["pl-agent-core", "pl-agent-adapters", "pl-agent-api"]

[tool.uv.sources]
pl-agent-core = { workspace = true }
pl-agent-adapters = { workspace = true }
pl-agent-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "packages/adapters", "packages/api"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "packages/adapters", "packages/api", "packages"]
asyncio_mode = "auto"
testpaths = [
    "packages/core/pl_agent/core/__tests__",
    "packages/adapters/adapters/paldb/__tests__",
    "tests",
]
