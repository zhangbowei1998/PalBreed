# PostgreSQL + pgAdmin for pl-agent
# 启动: docker compose up -d
# pgAdmin: http://localhost:5051 (admin@admin.com / admin)
# 停止: docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: pl-agent-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pl_agent
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/sql:/docker-entrypoint-initdb.d # 自动执行 DDL
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pl_agent" ]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pl-agent-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
